<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" role="img" aria-label="Christian Open Library">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8"><stop offset="0" stop-color="#0f2617"/><stop offset="1" stop-color="#040806"/></radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9f5e0"/><stop offset="1" stop-color="#f4fff7"/></linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#d9f5e0"/><stop offset="1" stop-color="#f4fff7"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a3a"/><stop offset="1" stop-color="#0e4222"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feFlood flood-color="#3fb950"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <text x="128" y="132" text-anchor="middle" font-family="'Liberation Mono', ui-monospace, Menlo, Consolas, monospace" font-size="130" font-weight="700" fill="#effff3" filter="url(#glow)">λ</text>
  <!-- glow under the book -->
  <ellipse cx="128" cy="214" rx="96" ry="14" fill="#3fb950" opacity="0.35" filter="url(#soft)"/>
  <!-- cover, visible as a rim beneath the pages -->
  <path d="M26 176 C 62 166, 100 168, 128 182 C 156 168, 194 166, 230 176 L230 208 C 194 198, 156 200, 128 214 C 100 200, 62 198, 26 208 Z" fill="url(#cover)" stroke="#3fb950" stroke-width="3" stroke-linejoin="round"/>
  <!-- stacked page edges -->
  <path d="M32 170 C 64 160, 100 162, 128 176 L128 204 C 100 192, 64 190, 32 200 Z" fill="#b8e6c4"/>
  <path d="M224 170 C 192 160, 156 162, 128 176 L128 204 C 156 192, 192 190, 224 200 Z" fill="#b8e6c4"/>
  <!-- pages -->
  <path d="M34 164 C 66 154, 100 156, 128 170 L128 198 C 100 185, 66 184, 34 194 Z" fill="url(#pageL)"/>
  <path d="M222 164 C 190 154, 156 156, 128 170 L128 198 C 156 185, 190 184, 222 194 Z" fill="url(#pageR)"/>
  <!-- text lines -->
  <g stroke="#2e8b4a" stroke-width="2.2" stroke-linecap="round" opacity="0.75" fill="none">
    <path d="M46 170 C 68 163, 92 165, 114 175"/><path d="M46 178 C 68 171, 92 173, 114 183"/><path d="M46 186 C 68 180, 92 181, 114 190"/>
    <path d="M210 170 C 188 163, 164 165, 142 175"/><path d="M210 178 C 188 171, 164 173, 142 183"/><path d="M210 186 C 188 180, 164 181, 142 190"/>
  </g>
  <!-- spine shadow -->
  <path d="M128 170 L128 198" stroke="#1f7a3a" stroke-width="3" stroke-linecap="round"/>
</svg>

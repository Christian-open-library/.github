name: Request library access
description: Ask for an invitation to download the library.
title: "Library access: "
labels: ["access request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest. We'll invite your GitHub account; watch for the email from GitHub and accept it.
        You don't need to ask for the AI connector: anyone can sign in to it with their email or GitHub.
        **This request is public.** Don't include an email address, phone number or other private details.
  - type: input
    id: name
    attributes:
      label: Your name (optional)
    validations:
      required: false
  - type: textarea
    id: use
    attributes:
      label: How will you use the library?
      description: "For example: sermon preparation, teaching, research."
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: "I've read [what members may do with the books](https://christianopenlibrary.org/download.html#reuse). I won't republish the collection or put it in an app or AI service without asking first."
          required: true
